<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remi — 解析检查台</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0e0e10;color:#e6e6ea;
       font:14px/1.55 ui-sans-serif,-apple-system,"PingFang SC",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  .sub{color:#6e6e73;font-size:12.5px;margin:0 0 20px}
  .sub b{color:#ff9a91}

  .codes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .chip{background:#1a1a1d;border:1px solid #2a2a2e;border-radius:9px;padding:8px 11px;
        cursor:pointer;text-align:left;color:inherit;font:inherit;max-width:300px;
        transition:border-color .12s,background .12s}
  .chip:hover{border-color:#3d3d43}
  .chip[aria-pressed="true"]{background:#242429;border-color:#6a6a73}
  .chip .n{font-size:16px;font-weight:650}
  .chip .lab{font-size:12.5px;margin-left:6px}
  .chip .rule{display:block;color:#6e6e73;font-size:10.5px;margin-top:3px;line-height:1.4}
  .chip .conf{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;
              margin-top:4px;background:#2a2a2e;color:#8e8e93}
  .chip .conf.guess{background:#3a2a12;color:#ffb454}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 4px;padding:10px 0;
       border-top:1px solid #232325;border-bottom:1px solid #232325}
  select,input[type=search]{background:#161619;border:1px solid #2a2a2e;color:#e6e6ea;
       border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px}
  input[type=search]{min-width:230px}
  .reset{background:none;border:none;color:#6e6e73;cursor:pointer;font:inherit;
         font-size:12px;text-decoration:underline}
  .count{margin-left:auto;color:#6e6e73;font-size:12px;font-variant-numeric:tabular-nums}

  .item{border-bottom:1px solid #1c1c1f}
  .r1{display:grid;grid-template-columns:1fr 200px 155px;gap:14px;align-items:start;
      padding:11px 4px;cursor:pointer}
  .r1:hover{background:#151518}
  .name{font-weight:550}
  .store{color:#6e6e73;font-size:11px;margin-left:8px;font-weight:400}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:10.5px;padding:1.5px 7px;border-radius:5px;
       background:#3a1d1a;color:#ff9a91;border:1px solid #4d2622}
  .tag.guess{background:#3a2a12;color:#ffb454;border-color:#4d3a18}
  .clean{font-size:10.5px;color:#4ec98a;opacity:.65}
  .parsed{color:#9a9aa0;font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
  .up{font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
  .up.none{color:#6e6e73}

  .body{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:2px 4px 20px}
  .box h4{margin:0 0 7px;font-size:11px;color:#6e6e73;font-weight:600;letter-spacing:.04em}
  pre{margin:0;background:#141417;border:1px solid #202024;border-radius:8px;padding:11px 13px;
      font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c9c9cf;
      white-space:pre-wrap;word-break:break-word}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px;margin:0}
  .kv dt{color:#6e6e73}
  .kv dd{margin:0;font-variant-numeric:tabular-nums}
  .why{margin-top:10px;font-size:12px;color:#ffb0a8;line-height:1.7}
  .why b{color:#ff8b80}
  .note{color:#6e6e73;font-size:11.5px;margin-top:8px;line-height:1.6}
  .hist{grid-column:1/-1}
  .hist summary{cursor:pointer;color:#6e6e73;font-size:11.5px;padding:5px 0}
  .ver{border-left:2px solid #2a2a2e;padding:6px 0 6px 12px;margin:6px 0 0}
  .ver .vh{font-size:11.5px;color:#9a9aa0}
  .ver .vv{font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px}

  .more{display:block;width:100%;margin:18px 0 0;padding:11px;background:#18181b;
        border:1px solid #26262a;border-radius:9px;color:#9a9aa0;font:inherit;
        font-size:12.5px;cursor:pointer}
  .more:hover{border-color:#3d3d43}
  .empty{padding:50px 0;text-align:center;color:#6e6e73}
</style>
</head>
<body>
<div class="wrap">

  <h1>解析检查台</h1>
  <p class="sub">
    {{ n_total }} 条已发布数据 · <b>{{ n_faulty }}</b> 条至少命中一个故障码 · 解析器版本 v1（基线）
  </p>

  <div class="codes">
    {% for code, label, rule, conf, n in summary %}
    <button class="chip" data-code="{{ code }}" aria-pressed="false">
      <span class="n">{{ n }}</span><span class="lab">{{ label }}</span>
      <span class="rule">{{ rule }}</span>
      <span class="conf {{ 'guess' if '启发' in conf else '' }}">{{ conf }}</span>
    </button>
    {% endfor %}
  </div>

  <div class="bar">
    <select id="f-store"><option value="">全部店</option>
      {% for s in stores %}<option>{{ s }}</option>{% endfor %}</select>
    <select id="f-state"><option value="">全部条目</option>
      <option value="faulty">仅有故障码的</option><option value="clean">仅干净的</option></select>
    <select id="f-sort"><option value="">默认排序</option>
      <option value="up-desc">单价从高到低</option><option value="up-asc">单价从低到高</option>
      <option value="n-desc">故障码最多的在前</option></select>
    <input type="search" id="f-q" placeholder="搜商品名 / 原文…">
    <button class="reset" id="reset">清空</button>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
  <button class="more" id="more" hidden></button>
  <div class="empty" id="empty" hidden>没有符合条件的条目</div>
</div>

<script id="data" type="application/json">{{ payload|tojson }}</script>
<script>
const ROWS = JSON.parse(document.getElementById('data').textContent);
ROWS.forEach((r, i) => {
  r._i = i;
  r._q = ((r.product_name||'') + ' ' + (r.deal_conditions||'') + ' ' + (r.brand||'')).toLowerCase();
  r._codes = r.faults.map(f => f.code);
});

const PAGE = 60;
const el = id => document.getElementById(id);
const active = new Set();
let shown = PAGE, view = ROWS;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => v == null ? null : '$' + Number(v).toFixed(2);

function compute(){
  const store = el('f-store').value, state = el('f-state').value;
  const q = el('f-q').value.trim().toLowerCase(), sort = el('f-sort').value;
  view = ROWS.filter(r => {
    if (store && r.store_name !== store) return false;
    if (state === 'faulty' && !r._codes.length) return false;
    if (state === 'clean'  &&  r._codes.length) return false;
    for (const c of active) if (!r._codes.includes(c)) return false;
    if (q && !r._q.includes(q)) return false;
    return true;
  });
  if (sort === 'up-desc') view = [...view].sort((a,b)=>(b.normalized_price??-1)-(a.normalized_price??-1));
  if (sort === 'up-asc')  view = [...view].sort((a,b)=>(a.normalized_price??1e9)-(b.normalized_price??1e9));
  if (sort === 'n-desc')  view = [...view].sort((a,b)=>b.faults.length-a.faults.length);
  shown = PAGE;
  render();
}

function rowHTML(r){
  const tags = r.faults.length
    ? r.faults.map(f => `<span class="tag ${/启发/.test(f.confidence)?'guess':''}" title="${esc(f.rule)}">${esc(f.label)}</span>`).join('')
    : '<span class="clean">无故障码</span>';
  const up = r.normalized_price != null
    ? `${money(r.normalized_price)} / ${esc(r.unit_norm)}`
    : '<span class="up none">无单价</span>';
  return `<article class="item" data-i="${r._i}">
    <div class="r1">
      <div>
        <span class="name">${esc(r.product_name)}</span><span class="store">${esc(r.store_name)}</span>
        <div class="tags">${tags}</div>
      </div>
      <div class="parsed">${r.price_flyer!=null?'$'+r.price_flyer:'—'} / ${esc(r.unit_flyer)||'—'}${r.per_unit_volume?' · '+esc(r.per_unit_volume):''}</div>
      <div class="up">${up}</div>
    </div>
  </article>`;
}

// Rows 2 and 3 are built only when an item is opened. Building all of them up
// front is what made the first version unusable.
function bodyHTML(r){
  const why = r.faults.map(f =>
    `<div><b>${esc(f.label)}</b> — ${esc(f.rule)}${f.detail?'（'+esc(f.detail)+'）':''}</div>`).join('');
  const up = r.normalized_price != null ? `${money(r.normalized_price)} / ${esc(r.unit_norm)}` : '—';
  const codes = r.faults.length ? r.faults.map(f=>esc(f.label)).join(' · ') : '无故障码';
  return `<div class="body">
    <div class="box">
      <h4>第二行 · 原文</h4>
      <pre>${esc(r.deal_conditions) || '（这条没有任何描述文字）'}</pre>
      ${r.brand?`<div class="note">品牌字段：${esc(r.brand)}</div>`:''}
      ${r.deal_type?`<div class="note">促销字段：${esc(r.deal_type)}</div>`:''}
    </div>
    <div class="box">
      <h4>第一行 · 解析结果</h4>
      <dl class="kv">
        <dt>价格</dt><dd>${r.price_flyer ?? '—'}</dd>
        <dt>单位</dt><dd>${esc(r.unit_flyer) || '—'}</dd>
        <dt>包装规格</dt><dd>${esc(r.per_unit_volume) || '（空）'}</dd>
        <dt>数量</dt><dd>${r.package_amount ?? '—'}</dd>
        <dt>算出单价</dt><dd>${up}</dd>
        <dt>有效期</dt><dd>${esc(r.b_from)} → ${esc(r.b_to)}</dd>
      </dl>
      ${why?`<div class="why">${why}</div>`:''}
    </div>
    <details class="hist">
      <summary>第三行 · 解析历史（1 个版本）▾</summary>
      <div class="ver">
        <div class="vh">v1 · 基线 · 当前解析器（还没改过）</div>
        <div class="vv">${up} · ${codes} · <span style="color:#6e6e73">未裁定</span></div>
      </div>
      <div class="note">改一次解析器多一层。裁定（确认／误报）和手动增删故障码还没做——先看这版检测得准不准。</div>
    </details>
  </div>`;
}

function render(){
  const slice = view.slice(0, shown);
  el('list').innerHTML = slice.map(rowHTML).join('');
  el('count').textContent = `${view.length} / ${ROWS.length} 条`;
  el('empty').hidden = view.length > 0;
  const rest = view.length - slice.length;
  el('more').hidden = rest <= 0;
  el('more').textContent = `再显示 ${Math.min(rest, PAGE)} 条（还剩 ${rest}）`;
}

el('list').addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (!item || e.target.closest('.hist')) return;
  const open = item.querySelector('.body');
  if (open) { open.remove(); return; }
  item.insertAdjacentHTML('beforeend', bodyHTML(ROWS[+item.dataset.i]));
});

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const code = c.dataset.code;
  active.has(code) ? active.delete(code) : active.add(code);
  c.setAttribute('aria-pressed', active.has(code));
  compute();
}));
['f-store','f-state','f-sort'].forEach(id => el(id).addEventListener('change', compute));
el('f-q').addEventListener('input', compute);
el('more').addEventListener('click', () => { shown += PAGE; render(); });
el('reset').addEventListener('click', () => {
  active.clear();
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', false));
  ['f-store','f-state','f-sort','f-q'].forEach(id => el(id).value = '');
  compute();
});
compute();
</script>
</body>
</html>
